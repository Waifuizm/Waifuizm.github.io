<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bizim Gülümüz 🌹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffb3cf; --pink-light:#5b2a7a;
    --ink:#ffe9f1; --leaf:#34a56f;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Quicksand',system-ui,sans-serif;
    background:radial-gradient(ellipse at 30% 20%,#2c1056,#140730 55%,#07030f);
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- ÇİÇEK ---------- */
  .flower{
    position:fixed; left:50%; top:50%;
    height:min(82vh,540px); aspect-ratio:3/5;
    transform:translate(-50%,-50%);
    transition:left 1.8s cubic-bezier(.65,0,.35,1), top 1.8s cubic-bezier(.65,0,.35,1), transform 1.8s cubic-bezier(.65,0,.35,1);
    cursor:pointer;
  }
  .flower svg{width:100%;height:100%;overflow:visible}
  body.moved .flower{left:25%}

  /* sap büyür */
  .stem{stroke-dasharray:320;stroke-dashoffset:320;animation:grow 1.8s .2s ease-out forwards}
  @keyframes grow{to{stroke-dashoffset:0}}

  /* yapraklar ve dikenler */
  .leaf{transform:scale(0);transform-origin:0 0;animation:pop 1s ease-out forwards}
  .leaf.l1{animation-delay:1.3s} .leaf.l2{animation-delay:1.6s}
  @keyframes pop{to{transform:scale(1)}}
  .thorn{opacity:0;animation:fade .5s 2s forwards}
  .sepal{opacity:0;animation:fade .8s 4.4s forwards}
  @keyframes fade{to{opacity:1}}

  /* gül: içten dışa yavaşça açılır */
  .petal{
    opacity:0; transform-origin:0 0;
    animation:bloom 2s cubic-bezier(.25,1.25,.5,1) both;
    animation-delay:calc(var(--d) + var(--i) * .14s);
  }
  @keyframes bloom{
    from{transform:scale(0) rotate(-35deg);opacity:0}
    35%{opacity:1}
    to{transform:scale(1) rotate(0);opacity:1}
  }

  /* ışıltı + parıltılar */
  .glow{opacity:0;animation:glow 3s 4.5s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:0}to{opacity:.75}}
  .spark{opacity:0;transform-box:fill-box;transform-origin:center;
    animation:twinkle 2.2s ease-in-out infinite; animation-delay:calc(6.5s + var(--s) * .35s)}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}

  /* hafifçe sallanma */
  .plant{transform-origin:150px 480px;animation:sway 4.5s 7s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}

  /* uçuşan kalpler */
  .flower{z-index:1} .gallery{z-index:2}
  .float{position:fixed;bottom:-50px;z-index:0;pointer-events:none;opacity:0;animation:floatUp linear infinite}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:.85}
    100%{transform:translateY(-115vh) rotate(40deg);opacity:0}
  }

  /* gece gökyüzü: kutup ışığı + yıldızlar */
  body::before{
    content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(30px);
    background:
      radial-gradient(40% 40% at 20% 30%,rgba(255,60,130,.35),transparent),
      radial-gradient(35% 35% at 80% 70%,rgba(120,80,255,.38),transparent),
      radial-gradient(30% 30% at 60% 20%,rgba(255,200,90,.18),transparent);
    animation:drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}
  .star{position:fixed;z-index:0;border-radius:50%;background:#fff;pointer-events:none;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  @keyframes shimmer{to{background-position:-300% 0}}

  /* arkada dönen ışık huzmeleri */
  .flower::before{
    content:""; position:absolute; left:50%; top:32%; width:300%; aspect-ratio:1; translate:-50% -50%;
    background:repeating-conic-gradient(rgba(255,214,140,.6) 0 4deg, transparent 4deg 16deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 68%); mask:radial-gradient(circle,#000 0,transparent 68%);
    opacity:0; pointer-events:none;
    animation:rays-in 2.5s 5s forwards, spin 45s linear infinite;
  }
  @keyframes rays-in{to{opacity:.85}}
  @keyframes spin{to{rotate:360deg}}
  .stem2{stroke-dasharray:100;stroke-dashoffset:100;animation:grow 1.6s var(--sd) ease-out forwards}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

  /* ---------- GALERİ ---------- */
  .gallery{
    position:fixed; top:0; right:0; bottom:0; width:50%;
    padding:36px 40px 40px 0;
    overflow-y:auto;
    opacity:0; visibility:hidden; transition:opacity .8s;
  }
  body.show .gallery{opacity:1;visibility:visible}
  .gallery h1{
    font-family:'Pacifico',cursive; font-weight:400;
    font-size:clamp(1.8rem,3.2vw,2.8rem); margin-bottom:22px;
    background:linear-gradient(90deg,#ffe9a8,#ff9ec4,#ffe9a8,#ff9ec4); background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 6s linear infinite;
  }
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}

  .photo{
    position:relative; aspect-ratio:4/5; overflow:hidden;
    border:4px solid #ffe3a3; border-radius:22px;
    background:linear-gradient(135deg,#4a2070,#7a2a55);
    box-shadow:0 0 26px rgba(255,110,170,.4), 0 8px 20px rgba(0,0,0,.4);
    cursor:zoom-in; opacity:0; transform:translateY(26px);
    rotate:-1.5deg; scale:1; transition:scale .25s, rotate .25s;
  }
  .photo:nth-child(even){rotate:1.5deg}
  .photo:hover{scale:1.04;rotate:0deg}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo.empty{cursor:default}
  .photo.empty::after{content:"🌸";position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem}
  .photo.empty img,.photo.empty video{display:none}
  .photo video{width:100%;height:100%;object-fit:cover;display:block}
  .photo.video{grid-column:1/-1;aspect-ratio:16/9}
  .photo.wide{grid-column:1/-1;aspect-ratio:16/10}
  .photo.video::before{
    content:"▶"; position:absolute; z-index:1; left:50%; top:50%; translate:-50% -50%;
    width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,.9); color:#c2185b;
    display:grid; place-items:center; padding-left:5px; font-size:1.4rem;
    box-shadow:0 6px 16px rgba(0,0,0,.25); pointer-events:none;
  }
  body.show .photo{animation:rise .7s cubic-bezier(.2,1.2,.4,1) forwards;animation-delay:calc(var(--n) * .12s)}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- BÜYÜTME (LIGHTBOX) ---------- */
  .lb{
    position:fixed; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center;
    background:rgba(8,3,20,.9); backdrop-filter:blur(6px);
  }
  .lb.open{display:flex}
  .lb img{
    max-width:min(92vw,1100px); max-height:86vh; border:6px solid #ffe3a3; border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4); animation:zoom .35s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes zoom{from{transform:scale(.8);opacity:0}}
  .lb video{
    display:none; max-width:min(92vw,1100px); max-height:86vh; background:#000;
    border:6px solid #ffe3a3; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:zoom .35s cubic-bezier(.2,1.3,.4,1);
  }
  .lb button{
    position:absolute; border:0; background:#fff; color:#c2185b;
    width:46px;height:46px;border-radius:50%; font-size:1.5rem; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .lb button:focus-visible{outline:3px solid var(--pink-light)}
  .lb .x{top:18px;right:18px} .lb .prev{left:18px} .lb .next{right:18px}

  /* ---------- TELEFON ---------- */
  @media (max-width:760px){
    body.moved .flower{left:50%;top:15%;transform:translate(-50%,-50%) scale(.36)}
    .gallery{width:100%;top:200px;padding:8px 18px 30px}
    .gallery h1{text-align:center;margin-bottom:16px}
    .grid{gap:12px}
    .lb .prev{left:6px} .lb .next{right:6px}
  }
  @media (prefers-reduced-motion:reduce){
    .petal,.plant{animation-duration:.01s;animation-delay:0s}
    .float,.spark,.glow{display:none}
  }
</style>
</head>
<body>

<div class="flower" id="flower" title="Atlamak için dokun">
  <svg viewBox="0 0 300 500" aria-label="Açan gül">
    <defs>
      <radialGradient id="gl"><stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/><stop offset=".5" stop-color="#ff6aa0" stop-opacity=".45"/><stop offset="1" stop-color="#ff6aa0" stop-opacity="0"/></radialGradient>
      <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b3124d"/><stop offset=".65" stop-color="#ff5a94"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>
      <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a50f45"/><stop offset=".65" stop-color="#ff4682"/><stop offset="1" stop-color="#ffbf80"/></linearGradient>
      <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#930c3d"/><stop offset="1" stop-color="#ff4d85"/></linearGradient>
      <linearGradient id="g4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6e0530"/><stop offset="1" stop-color="#d92468"/></linearGradient>
    </defs>
    <ellipse cx="150" cy="482" rx="75" ry="12" fill="#ff7fb0" fill-opacity=".3"/>
    <g class="plant">
      <path class="stem" d="M150 480 C152 420 142 340 150 170" fill="none" stroke="#34a56f" stroke-width="9" stroke-linecap="round"/>
      <path class="thorn" d="M148 404 L134 398 L148 394Z" fill="#2a8059"/>
      <path class="thorn" d="M152 362 L166 356 L152 352Z" fill="#2a8059"/>
      <g transform="translate(150 395) rotate(200)"><g class="leaf l1">
        <path d="M0 0 C22 -34 66 -38 100 -8 C66 18 22 16 0 0Z" fill="#2f9e6b"/>
        <path d="M4 -2 C35 -12 65 -14 92 -8" fill="none" stroke="#a8f0c8" stroke-opacity=".55" stroke-width="2"/></g></g>
      <g transform="translate(150 340) rotate(-25)"><g class="leaf l2">
        <path d="M0 0 C22 -34 66 -38 100 -8 C66 18 22 16 0 0Z" fill="#38b07a"/>
        <path d="M4 -2 C35 -12 65 -14 92 -8" fill="none" stroke="#a8f0c8" stroke-opacity=".55" stroke-width="2"/></g></g>
      <path class="stem2" style="--sd:1.4s" pathLength="100" d="M150 345 C120 330 90 300 66 258" fill="none" stroke="#34a56f" stroke-width="6" stroke-linecap="round"/>
      <path class="stem2" style="--sd:1.7s" pathLength="100" d="M150 310 C185 300 215 270 236 236" fill="none" stroke="#34a56f" stroke-width="6" stroke-linecap="round"/>
      <circle class="glow" cx="150" cy="160" r="135" fill="url(#gl)"/>
      <g id="sepals"></g>
      <g id="petals"></g>
    </g>
    <g id="sparks"></g>
  </svg>
</div>

<section class="gallery" id="gallery">
  <h1>Anılarımız 💕</h1>
  <div class="grid" id="grid"></div>
</section>

<canvas id="fx"></canvas>

<div class="lb" id="lb" aria-modal="true" role="dialog">
  <button class="x" aria-label="Kapat">✕</button>
  <button class="prev" aria-label="Önceki">‹</button>
  <img id="lbImg" alt="">
  <video id="lbVid" controls playsinline></video>
  <button class="next" aria-label="Sonraki">›</button>
</div>

<script>
  /* ===== AYARLAR — buradan düzenle ===== */
  const PHOTOS = [
    "Foto-1.jpeg", "Foto-2.jpeg", "Foto-3.jpeg", "Foto-4.jpeg",
    "Foto-5.jpeg", "Foto-6.jpeg", "Foto-7.jpeg", "Foto-8.jpeg",
    "Foto-9.jpeg", "Foto-10.jpeg", "Foto-11.jpeg", "Foto-12.jpeg",
    "Foto-13.jpeg", "Foto-14.jpeg", "Foto-15.jpeg", "Foto-16.jpeg",
    "Foto-17.jpeg", "Foto-18.jpeg", "Foto-19.jpeg",
    "video-1.mp4"   // video istemezsen bu satırı sil (üstteki virgülü de)
  ];
  const BURST_AT = 7000;    // kıvılcım/yaprak patlaması zamanı (ms)
  const MOVE_AFTER = 9500;   // çiçek açtıktan sonra sola kayma zamanı (ms)
  const SHOW_AFTER = 1500;   // kaymadan sonra fotoğrafların gelme zamanı (ms)
  /* ==================================== */

  // Gül buketi: ortada büyük gül + 2 küçük gül
  const petals = document.getElementById("petals");
  const PETAL = "M0 0 C-46 -20 -54 -80 -20 -94 C-8 -99 8 -99 20 -94 C54 -80 46 -20 0 0Z";
  const VEIN  = "M0 -8 C-12 -38 -14 -62 -7 -84 M0 -8 C12 -38 14 -62 7 -84";
  const RIM   = "M-24 -88 C-10 -96 10 -96 24 -88";
  const layers = [ /* adet, boyut, açı, renk, başlangıç(sn) */
    [6,1,0,"g1",4.1], [5,.78,36,"g2",3.4], [5,.56,18,"g3",2.7], [4,.34,45,"g4",2]
  ];
  function rose(cx,cy,k,t0,rot){
    return layers.map(([n,sc,off,g,d])=>
      `<g style="--d:${(d+t0).toFixed(2)}s">` + Array.from({length:n},(_,i)=>
        `<g transform="translate(${cx} ${cy}) rotate(${rot+off+i*360/n}) scale(${sc*k})"><g class="petal" style="--i:${i}">
          <path d="${PETAL}" fill="url(#${g})" stroke="rgba(120,10,50,.35)" stroke-width="1.4"/>
          <path d="${VEIN}" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.6" stroke-linecap="round"/>
          <path d="${RIM}" fill="none" stroke="#fff1c2" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
        </g></g>`).join("") + `</g>`
    ).join("") +
    `<g transform="translate(${cx} ${cy}) scale(${k})"><g class="petal" style="--d:${2.4+t0}s;--i:0">
       <circle r="7" fill="#7a0a32"/>
       <path d="M-3 0a3 3 0 1 1 6 0a6 6 0 1 1-12 0a9 9 0 1 1 18 2" fill="none" stroke="#ff8fb0" stroke-opacity=".6" stroke-width="1.6"/>
     </g></g>`;
  }
  petals.innerHTML = rose(66,252,.42,.6,15) + rose(236,228,.38,1,-10) + rose(150,160,1,0,0);

  // Çanak yapraklar (yeşil, ana gülün altında)
  document.getElementById("sepals").innerHTML = [120,150,180,210,240].map(a=>
    `<g transform="translate(150 160) rotate(${a})"><path class="sepal" d="M0 0C-16 -40 -10 -90 0 -112C10 -90 16 -40 0 0Z" fill="#34a56f"/></g>`).join("");

  // Altın ve pembe parıltılar
  const SP = ["#ffe27a","#fff","#ffd0e0","#ffe27a"];
  document.getElementById("sparks").innerHTML = [[50,90,9],[255,100,11],[40,200,7],[262,210,8],[150,28,10],[95,40,6],[210,38,7],
    [20,150,8],[282,160,7],[110,12,7],[190,14,8],[18,300,6],[285,290,8],[75,200,5],[228,160,6]].map(([x,y,k],i)=>
    `<g transform="translate(${x} ${y}) scale(${k})"><path class="spark" style="--s:${i}" d="M0 -1L.25 -.25L1 0L.25 .25L0 1L-.25 .25L-1 0L-.25 -.25Z" fill="${SP[i%4]}"/></g>`).join("");

  // Uçuşan kalpler ve çiçekler
  ["💖","🌸","✨","💕","🌹","💗","🌷"].concat(["💖","✨","💕","🌹","🌸"]).forEach(e=>{
    const f = document.createElement("span");
    f.className="float"; f.textContent=e;
    f.style.left = Math.random()*96 + "vw";
    f.style.fontSize = (14 + Math.random()*18) + "px";
    f.style.animationDuration = (9 + Math.random()*8) + "s";
    f.style.animationDelay = (Math.random()*10) + "s";
    document.body.appendChild(f);
  });

  // Yıldızlı gece
  for(let i=0;i<90;i++){
    const st = document.createElement("span"); st.className="star";
    const z = 1 + Math.random()*2.2;
    st.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*100}vh;width:${z}px;height:${z}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s`;
    document.body.appendChild(st);
  }

  // Havai fişek: patlama + yağan gül yaprakları
  const cv = document.getElementById("fx"), g2 = cv.getContext("2d");
  let W, H, parts = []; const DPR = Math.min(window.devicePixelRatio||1, 2);
  function fit(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; g2.setTransform(DPR,0,0,DPR,0,0); }
  fit(); addEventListener("resize",fit);
  const COL = ["#ff4d7e","#ffd76a","#ff7aa3","#ffe9a8","#ffffff","#ff2e6e"];
  function burst(x,y,n){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, v = 3 + Math.random()*9;
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.12+Math.random()*.08,r:Math.random()*6,vr:(Math.random()-.5)*.3,
        s:6+Math.random()*10,c:COL[i%COL.length],t:i%3?0:1,life:1,fade:.004+Math.random()*.004,drag:.985});
    }
  }
  function drip(){
    if(parts.length>120) return;
    parts.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5),vy:1+Math.random()*1.5,g:.005,r:0,vr:(Math.random()-.5)*.1,
      s:8+Math.random()*8,c:COL[Math.floor(Math.random()*3)],t:0,life:1,fade:.0015,drag:1,sway:Math.random()*6});
  }
  function loop(){
    g2.clearRect(0,0,W,H);
    parts = parts.filter(p=>p.life>0 && p.y<H+30);
    for(const p of parts){
      p.vx*=p.drag; p.vy=p.vy*p.drag+p.g; p.x+=p.vx+(p.sway?Math.sin(p.y/40+p.sway)*.6:0); p.y+=p.vy; p.r+=p.vr; p.life-=p.fade;
      g2.save(); g2.globalAlpha=Math.max(p.life,0); g2.translate(p.x,p.y); g2.rotate(p.r); g2.fillStyle=p.c; g2.beginPath();
      if(p.t){ const s=p.s; g2.moveTo(0,-s);g2.quadraticCurveTo(0,0,s,0);g2.quadraticCurveTo(0,0,0,s);g2.quadraticCurveTo(0,0,-s,0);g2.quadraticCurveTo(0,0,0,-s); }
      else g2.ellipse(0,0,p.s*.55,p.s,0,0,Math.PI*2);
      g2.fill(); g2.restore();
    }
    requestAnimationFrame(loop);
  }
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    loop();
    setTimeout(()=>{
      const r = document.getElementById("flower").getBoundingClientRect();
      const x = r.left + r.width/2, y = r.top + r.height*.32;
      burst(x,y,90); setTimeout(()=>burst(x,y,50),500);
      setInterval(drip,350);
    }, BURST_AT);
  }

  // Galeriyi oluştur
  const grid = document.getElementById("grid");
  PHOTOS.forEach((src,i)=>{
    const f = document.createElement("figure");
    f.className="photo"; f.style.setProperty("--n",i);
    let img;
    if(/\.(mp4|webm|mov)$/i.test(src)){
      img = document.createElement("video");
      img.src = src + "#t=0.1"; img.muted = true; img.preload = "metadata"; img.playsInline = true;
      f.classList.add("video");
    } else {
      img = new Image(); img.src=src; img.alt="Fotoğraf "+(i+1); img.loading="lazy";
    }
    img.onerror = ()=>f.classList.add("empty");
    f.appendChild(img);
    f.onclick = ()=>{ if(!f.classList.contains("empty")) openLb(i); };
    grid.appendChild(f);
  });

  const singles = [...grid.querySelectorAll(".photo:not(.video)")];
  if(singles.length % 2) singles[singles.length-1].classList.add("wide");

  // Çiçek kayar → fotoğraflar gelir
  let started = false;
  function go(){
    if(started) return; started = true;
    document.body.classList.add("moved");
    setTimeout(()=>document.body.classList.add("show"), SHOW_AFTER);
  }
  const timer = setTimeout(go, MOVE_AFTER);
  document.getElementById("flower").addEventListener("click",()=>{clearTimeout(timer);go();});

  // Büyütme
  const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbVid = document.getElementById("lbVid");
  let cur = 0;
  function openLb(i){
    cur = (i + PHOTOS.length) % PHOTOS.length;
    const src = PHOTOS[cur], isVid = /\.(mp4|webm|mov)$/i.test(src);
    lbVid.pause();
    lbImg.style.display = isVid ? "none" : "";
    lbVid.style.display = isVid ? "block" : "none";
    if(isVid){ lbVid.src = src; lbVid.play().catch(()=>{}); }
    else { lbVid.removeAttribute("src"); lbImg.src = src; lbImg.alt = "Fotoğraf " + (cur+1); }
    lb.classList.add("open");
  }
  const closeLb = ()=>{ lbVid.pause(); lb.classList.remove("open"); };
  lb.querySelector(".x").onclick = closeLb;
  lb.querySelector(".prev").onclick = e=>{e.stopPropagation();openLb(cur-1)};
  lb.querySelector(".next").onclick = e=>{e.stopPropagation();openLb(cur+1)};
  lb.onclick = e=>{ if(e.target===lb) closeLb(); };
  document.addEventListener("keydown",e=>{
    if(!lb.classList.contains("open")) return;
    if(e.key==="Escape") closeLb();
    if(e.key==="ArrowLeft") openLb(cur-1);
    if(e.key==="ArrowRight") openLb(cur+1);
  });
</script>
</body>
</html>
